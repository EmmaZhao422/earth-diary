name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    # Chromium is the required check. Firefox and WebKit run for information:
    # their headless builds on CI do not always have WebGL, which the map needs.
    continue-on-error: ${{ matrix.browser != 'chromium' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Serve the site and run the end-to-end test
        env:
          ED_BROWSER: ${{ matrix.browser }}
        run: |
          python -m http.server 8765 > /dev/null 2>&1 &
          sleep 2
          python tests/e2e.py tests/media /tmp/shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.browser }}
          path: /tmp/shots/*.png
